name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev
      - run: uv run ruff check src/tinyissimo_yolo/ tests/
      - run: uv run ruff format --check src/tinyissimo_yolo/ tests/
      - run: uv run pytest -v